<!DOCTYPE html>
<html>
<head>
    <title>Curve Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #f5f5f5; }
        .container {
            width: 1200px;
            height: 600px;
            background: white;
            border: 2px solid #ccc;
            position: relative;
            margin: 0 auto;
        }
        .curve-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .label {
            position: absolute;
            font-family: monospace;
            font-size: 14px;
            background: yellow;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <h2>Curve Comparison — Choose the best one</h2>

    <div class="container">
        <span class="label" style="top: 10px; left: 10px;">Option 1: C 15 50, 45 100, 100 100</span>
        <svg class="curve-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 0 0 C 15 50, 45 100, 100 100" fill="none" stroke="red" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
    </div>

    <div class="container" style="margin-top: 20px;">
        <span class="label" style="top: 10px; left: 10px;">Option 2: C 10 55, 50 98, 100 100</span>
        <svg class="curve-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 0 0 C 10 55, 50 98, 100 100" fill="none" stroke="red" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
    </div>

    <div class="container" style="margin-top: 20px;">
        <span class="label" style="top: 10px; left: 10px;">Option 3: C 20 60, 55 95, 100 100</span>
        <svg class="curve-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 0 0 C 20 60, 55 95, 100 100" fill="none" stroke="red" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
    </div>

    <div class="container" style="margin-top: 20px;">
        <span class="label" style="top: 10px; left: 10px;">Option 4: C 25 55, 60 95, 100 100</span>
        <svg class="curve-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 0 0 C 25 55, 60 95, 100 100" fill="none" stroke="red" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
    </div>

    <div class="container" style="margin-top: 20px;">
        <span class="label" style="top: 10px; left: 10px;">Option 5: C 30 70, 60 95, 100 100</span>
        <svg class="curve-overlay" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 0 0 C 30 70, 60 95, 100 100" fill="none" stroke="red" stroke-width="2" vector-effect="non-scaling-stroke"/>
        </svg>
    </div>
</body>
</html>
